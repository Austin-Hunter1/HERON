H_     = { value = 120.0, unit = "mm", comment = "Interior height, bottom plate top to top plate underside (heron_rack H)" }
M3_CLR_D = { value = 3.4, unit = "mm", comment = "M3 clearance hole diameter. heron_rack circ(...,3.4) in plates, walls, trays, latch" }
RACK_Z0 = { expr = "T_", unit = "mm", comment = "Fusion world Z of the CadQuery world origin. The bottom plate (local z 0..T) is grounded at the Fusion origin, so the CadQuery z=0 plane (plate top) is T_ above it. Not in heron_rack.py" }

