# Seed values for the flight_rack Fusion design (decision D-035).
#
# Why this file exists: Fusion is the master model. This file only seeds a
# NEW design. After that, you edit the User Parameters in Fusion.
#
# Source of every value: Hardware/payload_rack/heron_rack.py (frozen).
# Names follow heron_rack.py. Three names get a trailing underscore because
# Fusion refuses the bare name (they are unit symbols): T -> T_, H -> H_, W -> W_.
# Lists are flattened with 1-based suffixes (WALL_TAB_Y1, ...).
# Order matters: a parameter can use only names that come before it.
# Tags VERIFY and PROPOSED are copied from heron_rack.py.
#
# Format: NAME = { value = 3.0, unit = "mm", comment = "..." }
#     or  NAME = { expr = "...", unit = "mm", comment = "..." }
# unit is "mm", "deg" or "none" (unitless count or factor).

[kicad]
# Clock board rev C file. Path is relative to this folder. The builder reads
# J1..J10 from it and makes the CLK_J<n>_KX / _KY parameters (sync_kicad.py
# updates them later).
pcb = "../../clock_board_revD/project/heron_clock.kicad_pcb"
# KiCad page origin offset: heron_rack.py `_clk_read` subtracts 100.0 from x and y.
origin = 100.0

[materials]
# Applied by apply_materials.py by category. Library: Fusion Material Library.
# Category "ref" gets no material (translucent appearance).
laser = "Plywood, Finish"
rigid = "ABS Plastic"
flex = "Rubber"
library = "Fusion Material Library"

[ref_look]
# Look of the "ref" parts (reference envelopes, not made). They get no
# material. The colour copies the CadQuery ref colour (0.2, 0.55, 0.3, alpha 0.6).
# `base` is a library appearance that is copied once into the design.
library = "Fusion Appearance Library"
base = "Plastic - Translucent Matte (Green)"
name = "HERON ref green"
red = 0.2
green = 0.55
blue = 0.3
alpha = 0.6

# Slot order is the order along X. pitch names a parameter below.
[[slots]]
name = "NUC"
kind = "nuc"
pitch = "PITCH_NUC"

[[slots]]
name = "B210_1"
kind = "b210"
pitch = "PITCH_B210_1"

[[slots]]
name = "B210_2"
kind = "b210"
pitch = "PITCH_B210_2"

[[slots]]
name = "B200_1"
kind = "b200"
pitch = "PITCH_B200_1"

[[slots]]
name = "B200_2"
kind = "b200"
pitch = "PITCH_B200_2"

[params]
