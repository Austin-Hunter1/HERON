<!doctype html><meta charset="utf-8"><title>HERON Studio</title>
<style>html,body{margin:0;height:100%;background:#0c141b;color:#e7eef3;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;-webkit-app-region:drag}
.b{display:flex;flex-direction:column;align-items:center;gap:14px}.m{width:56px;height:56px;border-radius:14px;background:#123b3c;display:grid;place-items:center}
.l{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.l i{display:block;width:40%;height:100%;background:#4fd6ff;animation:s 1.1s infinite ease-in-out}
@keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}} small{color:#93a3b0} pre{color:#ff6b5e;max-width:80vw;white-space:pre-wrap}</style>
<div class="b"><div class="m"><svg viewBox="0 0 64 64" width="40" height="40"><path d="M10 44c10-3 15-15 22-26 5 8 8 15 22 18" fill="none" stroke="#4fd6ff" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="18" r="4" fill="#3ddc97"/></svg></div>
<b>HERON Studio</b><div class="l"><i></i></div><small id="m">Starting the processing engine…</small><pre id="e"></pre></div>
<script>window.addEventListener("message",e=>{if(e.data?.error){document.getElementById("e").textContent=e.data.error;document.getElementById("m").textContent="The engine didn't start."}})</script>
