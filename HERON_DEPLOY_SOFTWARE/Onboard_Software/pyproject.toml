[project]
name = "heron-onboard"
version = "0.1.0"
description = "HERON onboard supervisor: capture control, payload link, disk and health monitoring."
requires-python = ">=3.11"
dependencies = [
    "heron-common",
    "pydantic>=2.6",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
mavlink = ["pymavlink>=2.4.40"]

[project.scripts]
heron-onboard = "heron_onboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heron_onboard"]

[tool.uv.sources]
heron-common = { workspace = true }
