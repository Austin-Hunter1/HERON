# HERON onboard config template.
# Copy to onboard.toml on the payload and edit the machine values
# (serial numbers, ports, paths). Every key here is validated at start.
# Sizing: 2x B210 @ 22 Msps x 2 ch + 2x B200 @ 22 Msps x 1 ch
#         = 6 channels x 44 MB/s = 264 MB/s at sc8. Check with
#         `heron-onboard check-config`.

[general]
log_level = "INFO"
log_dir = "/media/DataStore/logs"
tick_s = 0.1

[link]
# Flight: "mavlink" through the Cube (D-016). Bench: "udp", "serial", or "loopback".
transport = "mavlink"

[link.mavlink]
device = "/dev/serial/by-id/CHANGE_ME-cube-telem2"
baud = 921600
source_system = 1        # Same system id as the vehicle.
source_component = 191   # MAV_COMP_ID_ONBOARD_COMPUTER
target_system = 250      # heron-base on the laptop
target_component = 0
payload_type = 200
heartbeat_hz = 1.0
chunk_bytes = 125
reassembly_timeout_s = 5.0

[link.udp]
local_host = "0.0.0.0"
local_port = 14600
remote_host = "0.0.0.0"
remote_port = 0          # 0 = learn the laptop address from its first packet.

[link.serial]
port = "/dev/serial/by-id/CHANGE_ME-telemetry-radio"
baud = 57600

[telemetry]
rate_hz = 1.0
include_temps = true

[control]
fallback_mode = "record_if_no_link"   # record_if_no_link | record_at_boot | none
link_grace_s = 120
link_lost_s = 10
rearm_fallback_on_link_loss = false
flight_id_prefix = ""

[disk]
data_root = "/media/DataStore/iq"
min_free_gb = 20
min_free_pct = 5
check_interval_s = 2

[capture]
recorder_binary = "/usr/local/bin/heron_recorder"
segment_seconds = 30
cpu_format = "sc8"        # File format (D-009).
# Sample path and write method of the collect wizard (D-078).
wire_format = "sc8"       # USB format. sc8 = the wizard method; sc16 doubles USB load.
wire_peak = 1.0           # UHD sc8 scale (wizard value). Used only with wire_format = "sc8".
int_n = true              # Integer-N LO tuning (wizard --int-n).
write_mode = "direct"     # direct = recv then write in one loop (wizard); threaded = writer thread.
spb = 10000               # Samples per recv() call (wizard --spb). Tune with buffer-test.
file_buffer_bytes = 0     # stdio buffer per file; 0 = C library default (wizard).
fsync_segments = true     # fsync each closed segment (O16). Blocks the loop in direct mode.
sync_lead_s = 6           # Seconds from launch to the common PPS sync epoch.
start_lead_s = 3          # Seconds from the sync epoch to the first sample.
buffer_seconds = 4        # Chunk pool length, threaded write mode only.
status_interval_s = 1
lock_timeout_s = 10
ready_timeout_s = 60
stop_timeout_s = 15
file_extension = "sc8"

# NUC buffer-size test: `heron-onboard buffer-test --config FILE`.
# It records `duration_s` with every combination of the lists below on
# one SDR, then writes a CSV of overflows, drops and write rate.
# An empty device-args list keeps the SDR's own device_args value.
[buffer_test]
sdr_id = "b210_1"
duration_s = 30
settle_s = 5
outdir = "/media/DataStore/iq/buffer_test"
results_csv = "/media/DataStore/iq/buffer_test/results.csv"
keep_files = false
# 2 x 3 x 3 x 2 x 2 = 72 trials, about 45 min. `--dry-run` lists them.
write_modes = ["direct", "threaded"]
spb = [2000, 10000, 50000]
num_recv_frames = [32, 256, 1024]
recv_frame_size = [8000, 16000]
file_buffer_bytes = [0, 4194304]

[health]
temp_labels = ["coretemp", "nvme", "acpitz"]

# GNSS band names used by the channels below and by metadata.yml (D-022).
[bands]
L1 = 1575.42e6
L5 = 1176.45e6

# ---- SDR units (D-008, D-020, D-024). Signal plan is placeholder (Q-001). ----
# bandwidth_hz is the operator's value for each channel (D-078). The
# collect wizard offers: L5 and L1 = 15 MHz at 15 Msps, L1CA = 5 MHz at
# 5 Msps. Keep bandwidth_hz <= sample_rate_hz.
# clock_source: 10 MHz reference input. All four units take the GPSDO 10 MHz.
# time_source:  PPS input. The B210 and the B200 both have separate REF and PPS
#               inputs, and all four take the GPSDO PPS: "external" (D-024).
#               Use "none" only for a unit with no PPS cable (bench).

[[sdr]]
id = "b210_1"
model = "b210"
serial = "CHANGE_ME_1"
device_args = "recv_buff_size=2e7,num_recv_frames=256"
sample_rate_hz = 22e6
clock_source = "external"
time_source = "external"

  [[sdr.channels]]
  id = "L5_direct"
  index = 0
  band = "L5"
  center_freq_hz = 1176.45e6
  gain_db = 45
  bandwidth_hz = 15e6
  antenna = "RX2"
  antenna_label = "A1 up RHCP"

  [[sdr.channels]]
  id = "L5_reflected_L"
  index = 1
  band = "L5"
  center_freq_hz = 1176.45e6
  gain_db = 45
  bandwidth_hz = 15e6
  antenna = "RX2"
  antenna_label = "A2 down LHCP"

