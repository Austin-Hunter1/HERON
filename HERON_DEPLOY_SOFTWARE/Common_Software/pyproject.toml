[project]
name = "heron-common"
version = "0.1.0"
description = "Code shared by the HERON onboard and base station software: config, protocol, transports."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
mavlink = ["pymavlink>=2.4.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heron_common"]
