[project]
name = "heron-base"
version = "0.1.0"
description = "HERON ground station: live health display, start/stop control, GNSS logging."
requires-python = ">=3.11"
dependencies = [
    "heron-common",
    "pydantic>=2.6",
    "textual>=0.70",
    "pyserial>=3.5",
]

[project.optional-dependencies]
mavlink = ["pymavlink>=2.4.40"]
demo = ["heron-onboard"]

[project.scripts]
heron-base = "heron_base.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heron_base"]

[tool.uv.sources]
heron-common = { workspace = true }
heron-onboard = { workspace = true }
