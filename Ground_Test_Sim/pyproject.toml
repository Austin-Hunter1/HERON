[project]
name = "ground-test-sim"
version = "0.1.0"
description = "HERON ground test simulation: specular tracks and Fresnel zones for a fixed receiver."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pillow>=10.0",
    "shapely>=2.0",
    "sgp4>=2.23",
    "tzdata>=2024.1",
]

[project.scripts]
ground-sim = "ground_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ground_sim"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
